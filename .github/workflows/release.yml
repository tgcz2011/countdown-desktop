name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: PyInstaller package
        shell: pwsh
        run: python -m PyInstaller --noconfirm CountdownDesktop.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DVERSION=$version installer\setup.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: countdown-desktop-${{ steps.version.outputs.version }}
          path: |
            CountdownDesktop_Setup_*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Countdown Desktop v${{ steps.version.outputs.version }}
          files: |
            CountdownDesktop_Setup_*.exe
          generate_release_notes: true
