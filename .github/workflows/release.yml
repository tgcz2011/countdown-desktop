name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: Build CEF helper (downloads CEF + MinGW)
        shell: pwsh
        run: |
          python third_party\build_cef_helper.py

      - name: PyInstaller package
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name CountdownDesktop `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineQuick `
            --exclude-module PySide6.QtWebChannel `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            run.py

      - name: Copy CEF runtime into package
        shell: pwsh
        run: |
          $src = "third_party\cef_helper"
          $dst = "dist\CountdownDesktop"
          Copy-Item "$src\cef_helper.exe","$src\libcef.dll" $dst -Force
          Copy-Item "$src\d3dcompiler_43.dll","$src\d3dcompiler_47.dll","$src\libEGL.dll","$src\libGLESv2.dll" $dst -Force
          Copy-Item "$src\natives_blob.bin","$src\snapshot_blob.bin","$src\widevinecdmadapter.dll","$src\icudtl.dat" $dst -Force -ErrorAction SilentlyContinue
          Copy-Item "$src\Resources" "$dst\Resources" -Recurse -Force

      - name: Setup NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$version installer\setup.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: countdown-desktop-${{ steps.version.outputs.version }}
          path: |
            dist/CountdownDesktop/CountdownDesktop.exe
            CountdownDesktop_Setup_*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Countdown Desktop v${{ steps.version.outputs.version }}
          files: |
            dist/CountdownDesktop/CountdownDesktop.exe
            CountdownDesktop_Setup_*.exe
          generate_release_notes: true
